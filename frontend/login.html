<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Neosuplex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos rápidos para centrar el login */
        .login-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .login-logo { width: 150px; margin-bottom: 20px; }
        .login-box h2 { margin-bottom: 30px; color: var(--color-text-light); }
        .login-box .form-group { text-align: left; }
        .login-box label { display: block; margin-bottom: 8px; color: var(--color-text-dull); font-size: 13px; }
        .login-box input { width: 100%; padding: 12px; background: var(--color-bg-input); border: 1px solid var(--color-border); color: white; border-radius: 6px; margin-bottom: 20px; font-family: 'Poppins', sans-serif;}
        .login-box input:focus { border-color: var(--color-primary); outline: none; }
        .login-link { color: var(--color-primary); font-size: 14px; display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="imagenes/Logo1.0.png" alt="Neosuplex Logo"> </a>
            <nav class="nav">
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="carrito.html" class="cart-icon" style="color: var(--color-primary);">
                    <i class="fas fa-shopping-cart"></i><span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h2>Bienvenido a Neosuplex</h2>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email-login" placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="pass-login" placeholder="••••••••">
            </div>
            <button class="btn-blue btn-full mt-3" onclick="iniciarSesion()">Iniciar Sesión</button>
            <a href="#" class="login-link">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </section>

    <script>
        function iniciarSesion() {
            // Leemos lo que el usuario escribió
            let email = document.getElementById('email-login').value;
            let password = document.getElementById('pass-login').value;

            // Verificamos si las credenciales son del proveedor
            if (email === "proveedor@neosuplex.com" && password === "admin123") {
                // Le damos la llave maestra
                localStorage.setItem('esProveedor', 'true');
                alert("¡Bienvenido al Panel de Control, Proveedor!");
                window.location.href = "proveedor.html"; // Lo llevamos a su panel
            } else {
                // Si es cualquier otra persona, entra como cliente normal
                localStorage.removeItem('esProveedor'); // Nos aseguramos de que no tenga llave
                alert("¡Sesión iniciada con éxito como cliente!");
                window.location.href = "index.html"; // Lo llevamos a la tienda
            }
        }
    </script>

    <script src="main.js"></script>
</body>
</html>
